<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>끝말잇기 단어 검색 사전</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>끝말잇기 단어 검색</h1>

    <div class="search-box">
      <input type="text" id="start-input" placeholder="시작 단어를 입력하세요 (예: 사과)" autocomplete="off">
      <button id="search-btn">검색</button>
    </div>

    <div class="result-box">
      <div id="result-info" class="result-info">시작 단어를 입력하고 검색을 눌러주세요.</div>
      <ul id="word-list"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
