<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>끝말잇기 단어 찾기</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>〈 끝말잇기 〉</h1>

        <div class="search-area">
            <input
                type="text"
                id="startWord"
                placeholder="시작 단어"
                autocomplete="off"
            >

            <button id="searchButton">
                검색
            </button>
        </div>

        <div class="result-box">
            <div id="results">
                <div class="empty">
                    시작 단어를 입력해주세요.
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
