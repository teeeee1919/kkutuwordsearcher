<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>끝말잇기 단어 찾기</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>끝말잇기 단어 찾기</h1>

        <p class="subtitle">
            시작 단어를 입력하세요
        </p>

        <div class="search-box">

            <input
                type="text"
                id="startWord"
                placeholder="시작 단어"
                autocomplete="off"
            >

            <button onclick="searchWords()">
                검색
            </button>

        </div>

        <div class="result-title">

            <span>검색 결과</span>

            <span id="resultCount">
                0개
            </span>

        </div>

        <div id="results" class="results">

            <div class="empty">
                시작 단어를 입력하고 검색해주세요.
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
