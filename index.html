<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>끝말잇기 단어 사전</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-card">
    <h1>끝말잇기 게임</h1>

    <div class="word-display">
      <span class="label">제시어</span>
      <div id="current-word">기차</div>
    </div>

    <form id="word-form">
      <input type="text" id="word-input" placeholder="단어를 입력하세요" autocomplete="off" required>
      <button type="submit">제출</button>
    </form>

    <div id="message" class="message"></div>

    <div class="history-container">
      <h3>입력한 단어 기록</h3>
      <ul id="history-list">
        <li>기차</li>
      </ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
